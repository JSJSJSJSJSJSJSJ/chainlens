[project]
name = "chainlens"
version = "0.1.0"
description = "Evidence-first listed-company relationship research"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<2.1",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
chainlens = "app.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
