name: Verify ChainLens

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install package managers
        run: |
          python -m pip install uv==0.11.28
          npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: |
          uv sync --frozen
          pnpm --dir frontend install --frozen-lockfile
      - name: Validate snapshot and backend
        run: |
          uv run python scripts/snapshots.py verify --manifest data/snapshots/manifest.json
          uv run chainlens import-snapshot
          uv run pytest
          uv run ruff check backend
      - name: Validate frontend
        run: |
          pnpm --dir frontend typecheck
          pnpm --dir frontend test
          pnpm --dir frontend build
      - name: Install browser and run real-backend workflow
        run: |
          pnpm --dir frontend exec playwright install --with-deps chromium
          pnpm --dir frontend e2e
